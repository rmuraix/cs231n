[project]
name = "cs231n"
version = "0.1.0"
description = "My codes for cs231n"
authors = [{ name = "Ryota Murai" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pickleshare",
    "tqdm",
    "h5py",
    "tabulate",
    "scipy",
    "imageio",
    "future",
    "cython",
    "optuna",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "ruff",
    "ipykernel",
    "pre-commit",
    "nbdev",
]
gpu = [
    "torch",
    "torchvision",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
extend-include = ["*.ipynb"]
